<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game 3: Lari Pecut - KAFA Arked</title>
    <style>
        :root {
            --bg-dark: #05050a;
            --road-dark: #1a1a24;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(0, 243, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --neon-cyan: #00f3ff;
            --neon-orange: #ff4500;
            --neon-red: #ff003c;
            --neon-green: #39ff14;
            --neon-yellow: #ffea00;
            --text-main: #f8fafc;
            --font-ui: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-arab: 'Traditional Arabic', 'Amiri', serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: var(--bg-dark); font-family: var(--font-ui); color: var(--text-main); user-select: none; }
        .ambient-light { position: fixed; width: 30vw; height: 100vh; filter: blur(90px); z-index: 0; opacity: 0.4; }
        .light-left { left: 0; background: linear-gradient(to right, var(--neon-cyan), transparent); }
        .light-right { right: 0; background: linear-gradient(to left, var(--neon-orange), transparent); }
        #track-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; z-index: 1; }
        #road { width: 100%; max-width: 900px; height: 100%; background: var(--road-dark); border-left: 5px solid var(--neon-cyan); border-right: 5px solid var(--neon-orange); display: flex; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 80px rgba(0,0,0,0.9); }
        #road::before { content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 200%; background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.2) 40px, rgba(255,255,255,0.2) 80px); animation: scrollRoad 1.5s linear infinite; pointer-events: none; z-index: 2; }
        @keyframes scrollRoad { 0% { transform: translateY(0); } 100% { transform: translateY(50%); } }
        body.is-boosting #road::before { animation: scrollRoad 0.3s linear infinite; background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, var(--neon-cyan) 40px, var(--neon-cyan) 80px); }
        .lane { flex: 1; border-right: 2px dashed rgba(255,255,255,0.1); position: relative; display: flex; justify-content: center; z-index: 5; }
        .lane:last-child { border-right: none; }
        #finish-line { position: absolute; top: 12%; width: 100%; height: 30px; background: repeating-linear-gradient(90deg, #fff 0, #fff 20px, #000 20px, #000 40px); z-index: 3; border-bottom: 3px solid var(--neon-yellow); box-shadow: 0 5px 20px var(--neon-yellow); }
        .finish-text { position: absolute; top: -35px; width: 100%; text-align: center; font-size: 1.5rem; font-weight: bold; color: var(--neon-yellow); text-shadow: 0 0 10px #000; }
        .car-wrapper { position: absolute; bottom: 5%; display: flex; flex-direction: column; align-items: center; transition: bottom 1s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 10; }
        .car-emoji { font-size: 3.5rem; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8)); transition: transform 0.3s; }
        .team-badge { background: rgba(0,0,0,0.8); border: 2px solid var(--neon-cyan); color: #fff; padding: 2px 8px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; margin-top: -5px; z-index: 11; }
        .car-wrapper.active-turn .car-emoji { transform: scale(1.3); filter: drop-shadow(0 0 20px var(--neon-yellow)); }
        .car-wrapper.active-turn .team-badge { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .car-wrapper.boosting .car-emoji { transform: scale(1.2) translateY(-20px); filter: drop-shadow(0 0 25px var(--neon-green)); }
        .car-wrapper.crashing .car-emoji { animation: shake 0.5s; filter: grayscale(0.8) drop-shadow(0 0 10px var(--neon-red)); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-10deg); } 75% { transform: translateX(10px) rotate(10deg); } }
        .float-score { position: absolute; font-size: 2.5rem; font-weight: bold; z-index: 100; pointer-events: none; animation: floatUp 1.2s ease-out forwards; }
        .float-correct { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green), 0 0 5px #fff; }
        .float-wrong { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red), 0 0 5px #fff; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-80px); opacity: 0; } }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 15px; box-shadow: var(--glass-shadow); }
        #quiz-hud { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -10%); width: 90%; max-width: 750px; padding: 25px; text-align: center; z-index: 100; display: none; flex-direction: column; gap: 20px; border-bottom: 4px solid var(--neon-cyan); opacity: 0; transition: opacity 0.4s, transform 0.4s; }
        #quiz-hud.show { display: flex; opacity: 1; transform: translate(-50%, 0); }
        #q-status { font-size: 1.2rem; color: var(--neon-yellow); text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
        #q-text { font-size: 2.8rem; font-weight: bold; color: #fff; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); direction: rtl; font-family: var(--font-arab); }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .ans-btn { flex: 1; padding: 18px; font-size: 1.8rem; font-weight: bold; border-radius: 12px; background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.2); color: white; cursor: pointer; transition: 0.3s; direction: rtl; font-family: var(--font-arab); }
        #btn-a { border-left: 5px solid var(--neon-cyan); }
        #btn-b { border-right: 5px solid var(--neon-orange); }
        .ans-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        #btn-a:hover { box-shadow: 0 0 25px var(--neon-cyan); border-color: var(--neon-cyan); }
        #btn-b:hover { box-shadow: 0 0 25px var(--neon-orange); border-color: var(--neon-orange); }
        #scoreboard { position: absolute; top: 20px; right: 20px; width: 230px; padding: 15px; z-index: 100; border-right: 3px solid var(--neon-yellow); }
        .score-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .team-row { display: flex; justify-content: space-between; padding: 8px 10px; margin-bottom: 5px; border-radius: 6px; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .team-row.active { background: rgba(0, 243, 255, 0.25); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); transform: scale(1.05); }
        #btn-settings { position: absolute; top: 20px; left: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--glass-bg); border: 2px solid var(--neon-orange); color: var(--neon-orange); font-size: 1.8rem; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; transition: 0.4s; box-shadow: 0 0 15px rgba(255, 69, 0, 0.3); }
        #btn-settings:hover { transform: rotate(90deg) scale(1.1); box-shadow: 0 0 25px var(--neon-orange); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 30px; direction: ltr; }
        .modal::-webkit-scrollbar { width: 8px; } .modal::-webkit-scrollbar-thumb { background: var(--neon-orange); border-radius: 4px; }
        .modal h2 { text-align: center; color: var(--neon-orange); font-size: 2rem; text-shadow: 0 0 15px var(--neon-orange); margin-bottom: 25px; border-bottom: 2px solid rgba(255, 69, 0, 0.3); padding-bottom: 15px; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: var(--neon-red); transform: scale(1.2); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--neon-cyan); }
        .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.6); color: white; font-size: 1.1rem; }
        .btn { padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; text-align: center; border: 2px solid transparent; width: 100%; }
        .btn-primary { background: rgba(255, 69, 0, 0.1); border-color: var(--neon-orange); color: var(--neon-orange); }
        .btn-primary:hover { background: var(--neon-orange); color: #000; box-shadow: 0 0 20px var(--neon-orange); }
        .btn-danger { background: rgba(255, 0, 60, 0.1); border-color: var(--neon-red); color: var(--neon-red); margin-top: 15px; }
        .btn-home { background: rgba(0, 243, 255, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); text-decoration: none; display: block; margin-top: 15px; }
        .table-wrap { max-height: 250px; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 10px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(0,0,0,0.8); color: var(--neon-orange); position: sticky; top: 0; }
        .td-arab { direction: rtl; font-size: 1.3rem; font-weight: bold; font-family: var(--font-arab); }
        .del-btn { background: none; border: none; color: var(--neon-red); font-size: 1.2rem; cursor: pointer; }
        .fs-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5, 5, 15, 0.95); z-index: 500; }
        .fs-screen h1 { font-size: 4rem; color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); margin-bottom: 20px; }
        @media (max-width: 768px) {
            #q-text { font-size: 2.2rem; }
            .ans-btn { font-size: 1.4rem; padding: 12px; }
            #scoreboard { position: relative; width: 95%; right: 0; top: 0; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; border: none; padding: 10px; }
            .team-row { margin: 0; font-size: 0.9rem; }
            .car-emoji { font-size: 2.5rem; }
            #quiz-hud { top: 25%; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="ambient-light light-left"></div>
    <div class="ambient-light light-right"></div>
    <button id="btn-settings" onclick="Editor.openModal()" title="Tetapan & Editor">⚙️</button>
    <div id="start-screen" class="fs-screen">
        <h1>🏎️ LARI PECUT</h1>
        <p style="font-size: 1.2rem; margin-bottom: 40px; color: var(--text-muted); max-width: 600px;">
            Kereta anda sedia untuk memecut!<br>Pilih <strong>Lorong Kiri (A)</strong> atau <strong>Lorong Kanan (B)</strong>.
        </p>
        <button class="btn btn-primary" style="max-width: 300px; font-size: 1.5rem;" onclick="Game.startMatch()">▶ MULA PERLUMBAAN</button>
    </div>
    <div id="end-screen" class="fs-screen" style="display: none;">
        <h1 style="color:var(--neon-yellow); text-shadow:0 0 20px var(--neon-yellow);">🏁 TAMAT PERLUMBAAN</h1>
        <div id="final-results" style="font-size: 1.5rem; margin-bottom: 30px; line-height: 2;"></div>
        <button class="btn btn-primary" style="max-width: 300px; margin-bottom: 15px;" onclick="location.reload()">🔄 MAIN SEMULA</button>
        <a href="index.html" class="btn btn-home" style="max-width: 300px;">🏠 HALAMAN UTAMA</a>
    </div>
    <div id="scoreboard" class="glass-panel">
        <div class="score-title">Kedudukan Perlumbaan</div>
        <div id="score-list"></div>
    </div>
    <div id="quiz-hud" class="glass-panel">
        <div id="q-status">KUMPULAN 1</div>
        <div id="q-text">Soalan muncul di sini</div>
        <div class="btn-group">
            <button class="ans-btn" id="btn-a" onclick="Game.submitAnswer(0)">KIRI (A)</button>
            <button class="ans-btn" id="btn-b" onclick="Game.submitAnswer(1)">KANAN (B)</button>
        </div>
    </div>
    <div id="track-container">
        <div id="road">
            <div id="finish-line">
                <div class="finish-text">GARISAN PENAMAT (100 MATA)</div>
            </div>
        </div>
    </div>
    <div id="overlay-editor" class="overlay">
        <div class="glass-panel modal" id="editor-modal">
            <button class="close-btn" onclick="Editor.closeModal()">✖</button>
            <h2>⚙️ EDITOR SOALAN LARI PECUT</h2>
            <div style="background: rgba(0,0,0,0.4); padding: 25px; border-radius: 15px; border: 1px dashed var(--neon-orange); margin-bottom: 20px;">
                <h3 style="color:var(--neon-cyan); margin-bottom: 15px;">➕ Tambah Halangan</h3>
                <div class="form-group"><label>Soalan:</label><input type="text" id="edit-q-text" class="form-control" dir="rtl"></div>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1;"><label>Lorong Kiri (A):</label><input type="text" id="edit-opt-1" class="form-control" dir="rtl"></div>
                    <div class="form-group" style="flex: 1;"><label>Lorong Kanan (B):</label><input type="text" id="edit-opt-2" class="form-control" dir="rtl"></div>
                </div>
                <div class="form-group"><label>Lorong Tepat:</label><select id="edit-ans" class="form-control"><option value="0">Kiri (A)</option><option value="1">Kanan (B)</option></select></div>
                <button class="btn btn-primary" onclick="Editor.saveQuestion()">💾 SIMPAN</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th style="width: 40px;">No.</th><th>Soalan</th><th style="width: 50px;">Aksi</th></tr></thead>
                    <tbody id="editor-tbody"></tbody>
                </table>
            </div>
            <button class="btn btn-danger" onclick="Editor.resetData()">🔄 RESET</button>
            <a href="index.html" class="btn btn-home">🏠 HALAMAN UTAMA</a>
        </div>
    </div>
    <script>
        const SFX = {
            ctx: null,
            playTone: function(freq, type, duration, vol=0.4) {
                if(localStorage.getItem('kafaSfx') === 'off') return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if(!this.ctx && AudioContext) this.ctx = new AudioContext();
                if(!this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            },
            correct: function() {
                this.playTone(400, 'sine', 0.1, 0.4);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.4), 100);
            },
            wrong: function() { this.playTone(180, 'square', 0.3, 0.4); }
        };

        const Data = {
            teams: parseInt(localStorage.getItem('kafaMultiplayerTeams')) || 4,
            scores: [], questions: [], targetScore: 100,
            defaultQuestions: [
                { q: "الإِسْمُ : ( الْمَاءُ / يَفْتَحُ )", options: ["الْمَاءُ", "يَفْتَحُ"], answer: 0 },
                { q: "الفِعْلُ : ( شَوْكَةٌ / يُعْطِي )", options: ["شَوْكَةٌ", "يُعْطِي"], answer: 1 },
                { q: "نَاجِحَةٌ فِي الإِمْتِحَان . ( هِيَ / هُنَّ )", options: ["هِيَ", "هُنَّ"], answer: 0 }
            ],
            init: function() {
                this.scores = Array(this.teams).fill(0);
                let saved = localStorage.getItem('kafaQuestionsModul3');
                if(saved) { try { this.questions = JSON.parse(saved); } catch(e) { this.questions = [...this.defaultQuestions]; } }
                else { this.questions = [...this.defaultQuestions]; }
            },
            save: function() { localStorage.setItem('kafaQuestionsModul3', JSON.stringify(this.questions)); }
        };

        const UI = {
            road: document.getElementById('road'),
            scoreList: document.getElementById('score-list'),
            hud: document.getElementById('quiz-hud'),
            qStatus: document.getElementById('q-status'),
            qText: document.getElementById('q-text'),
            btnA: document.getElementById('btn-a'),
            btnB: document.getElementById('btn-b'),
            cars: [],
            emojis: ['🏎️', '🚓', '🚕', '🚗', '🚙', '🚑', '🚜', '🚐'],
            buildTrack: function() {
                const finishLine = document.getElementById('finish-line');
                this.road.innerHTML = ''; this.road.appendChild(finishLine); this.cars = [];
                for(let i=0; i<Data.teams; i++) {
                    let lane = document.createElement('div'); lane.className = 'lane';
                    let carWrap = document.createElement('div'); carWrap.className = 'car-wrapper';
                    carWrap.innerHTML = `<div class="car-emoji">${this.emojis[i % this.emojis.length]}</div><div class="team-badge">P${i+1}</div>`;
                    lane.appendChild(carWrap); this.road.appendChild(lane); this.cars.push(carWrap);
                }
            },
            updateScoreboard: function(activeIdx = -1) {
                this.scoreList.innerHTML = '';
                for(let i=0; i<Data.teams; i++) {
                    let row = document.createElement('div'); row.className = 'team-row';
                    if(i === activeIdx) row.classList.add('active');
                    row.innerHTML = `<span>Kump ${i+1}</span> <span>${Data.scores[i]}</span>`;
                    this.scoreList.appendChild(row);
                }
            },
            updateCarsPosition: function() {
                for(let i=0; i<Data.teams; i++) {
                    let pct = (Data.scores[i] / Data.targetScore) * 80;
                    if(pct < 0) pct = 0; if(pct > 80) pct = 80;
                    this.cars[i].style.bottom = `calc(5% + ${pct}%)`;
                }
            },
            showFloatText: function(text, isCorrect, carElement) {
                let rect = carElement.getBoundingClientRect();
                let floatEl = document.createElement('div');
                floatEl.className = 'float-score ' + (isCorrect ? 'float-correct' : 'float-wrong');
                floatEl.innerText = text;
                floatEl.style.left = (rect.left + rect.width/2 - 25) + 'px';
                floatEl.style.top = (rect.top - 40) + 'px';
                document.body.appendChild(floatEl);
                setTimeout(() => floatEl.remove(), 1200);
            }
        };

        const Game = {
            currentTeam: 0, currentQ: null, isAnswering: false,
            startMatch: function() {
                document.getElementById('start-screen').style.display = 'none';
                Data.init(); UI.buildTrack();
                if(Data.questions.length === 0) Data.questions = [...Data.defaultQuestions];
                this.currentTeam = 0; this.nextTurn();
            },
            nextTurn: function() {
                this.isAnswering = true;
                this.currentQ = Data.questions[Math.floor(Math.random() * Data.questions.length)];
                UI.cars.forEach(c => c.classList.remove('active-turn', 'boosting', 'crashing'));
                UI.cars[this.currentTeam].classList.add('active-turn');
                UI.updateScoreboard(this.currentTeam);
                UI.qStatus.innerText = `GILIRAN KUMPULAN ${this.currentTeam + 1}`;
                UI.qText.innerText = this.currentQ.q;
                UI.btnA.innerText = this.currentQ.options[0];
                UI.btnB.innerText = this.currentQ.options[1];
                UI.hud.classList.add('show');
            },
            submitAnswer: function(optIdx) {
                if(!this.isAnswering) return;
                this.isAnswering = false;
                UI.hud.classList.remove('show');
                let car = UI.cars[this.currentTeam];
                car.classList.remove('active-turn');
                if(optIdx === this.currentQ.answer) {
                    SFX.correct();
                    Data.scores[this.currentTeam] += 10;
                    car.classList.add('boosting');
                    document.body.classList.add('is-boosting');
                    UI.showFloatText("+10", true, car);
                } else {
                    SFX.wrong();
                    Data.scores[this.currentTeam] -= 5;
                    if(Data.scores[this.currentTeam] < 0) Data.scores[this.currentTeam] = 0;
                    car.classList.add('crashing');
                    UI.showFloatText("❌", false, car);
                }
                UI.updateScoreboard(this.currentTeam);
                UI.updateCarsPosition();
                if(Data.scores[this.currentTeam] >= Data.targetScore) {
                    setTimeout(() => this.endMatch(this.currentTeam), 1500);
                    return;
                }
                setTimeout(() => {
                    document.body.classList.remove('is-boosting');
                    car.classList.remove('boosting', 'crashing');
                    this.currentTeam++;
                    if(this.currentTeam >= Data.teams) this.currentTeam = 0;
                    if(Data.questions.length > 0) this.nextTurn();
                    else {
                        let max = Math.max(...Data.scores);
                        this.endMatch(Data.scores.indexOf(max));
                    }
                }, 1500);
            },
            endMatch: function(winnerIdx) {
                document.getElementById('end-screen').style.display = 'flex';
                let resDiv = document.getElementById('final-results');
                resDiv.innerHTML = `🏁 <strong>KUMPULAN ${winnerIdx + 1} ${UI.emojis[winnerIdx % UI.emojis.length]}</strong> memenangi perlumbaan!<br><br>`;
                Data.scores.forEach((score, idx) => { resDiv.innerHTML += `Kumpulan ${idx + 1} : ${score} Mata <br>`; });
            }
        };

        const Editor = {
            overlay: document.getElementById('overlay-editor'),
            tbody: document.getElementById('editor-tbody'),
            openModal: function() { this.overlay.style.display = 'block'; this.render(); },
            closeModal: function() { this.overlay.style.display = 'none'; },
            render: function() {
                this.tbody.innerHTML = '';
                Data.questions.forEach((q, idx) => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td>${idx + 1}</td><td class="td-arab">${q.q}</td><td><button class="del-btn" onclick="Editor.delete(${idx})">🗑️</button></td>`;
                    this.tbody.appendChild(tr);
                });
            },
            saveQuestion: function() {
                let m = document.getElementById('edit-q-text').value.trim();
                let o1 = document.getElementById('edit-opt-1').value.trim();
                let o2 = document.getElementById('edit-opt-2').value.trim();
                let ans = parseInt(document.getElementById('edit-ans').value);
                if (!m || !o1 || !o2) return alert("Sila isi semua maklumat!");
                Data.questions.push({ q: m, options: [o1, o2], answer: ans });
                Data.save(); this.render();
                document.getElementById('edit-q-text').value = ''; document.getElementById('edit-opt-1').value = ''; document.getElementById('edit-opt-2').value = '';
            },
            delete: function(idx) { if(confirm("Padam soalan?")) { Data.questions.splice(idx, 1); Data.save(); this.render(); } },
            resetData: function() { if(confirm("Reset asal?")) { Data.questions = [...Data.defaultQuestions]; Data.save(); this.render(); } }
        };
    </script>
</body>
</html>
